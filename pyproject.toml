[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterixdb-mcp-server"
version = "0.1.0"
description = "Model Context Protocol gateway for Apache AsterixDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vivek Gangavarapu" }]
keywords = ["mcp", "asterixdb", "llm", "sql++", "model-context-protocol"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # HTTP transport (transport='http'): the Streamable HTTP ASGI app and server.
    "starlette>=0.37",
    "uvicorn>=0.27",
    # OAuth 2.1 resource-server JWT verification (auth_mode='oauth').
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
asterixdb-mcp-server = "asterixdb_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.3",
    "coverage>=7.4",
    "ruff>=0.4",
    "mypy>=1.9",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
# Extra dependencies for the opt-in accuracy suite (tests/accuracy). Installed
# only in the accuracy CI job; not needed for unit tests or the coverage gate.
accuracy = [
    "anthropic>=0.40",
    "openai>=1.40",
    "filelock>=3.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asterixdb_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live and accuracy tests need a running cluster (and, for accuracy, LLM API
# keys); they are opt-in and deselected from the default run. Trigger them with
# `-m live` or `-m accuracy`.
addopts = "-ra -m 'not accuracy and not live'"
markers = [
    "live: integration tests against a running cluster, no LLM (safe on every PR)",
    "accuracy: end-to-end LLM tool-calling accuracy tests (live cluster + API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

[tool.bandit]
# Scan application code only; tests and the local virtualenv are not shipped.
exclude_dirs = ["tests", ".venv"]
# B608 (hardcoded SQL): the gateway builds SQL++ from validated catalog
# identifiers and constant query fragments; all caller-supplied values are bound
# as named statement parameters ($dv, $ds, ...), never interpolated. The flagged
# sites interpolate only constants/identifiers, so B608 is a false positive here.
skips = ["B608"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Project policy: 100% line+branch coverage required; coverage report exits non-zero below this.
fail_under = 100
show_missing = true
