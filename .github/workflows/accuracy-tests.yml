name: Accuracy Tests

# LLM tool-calling accuracy suite. Costs real API spend and needs a live
# AsterixDB cluster, so it is opt-in: run it manually, or add the
# `accuracy-tests` label to a pull request.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  accuracy:
    name: Run accuracy tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'accuracy-tests'
    permissions:
      contents: read
      pull-requests: write
    env:
      ACCURACY_CC_BASE_URL: http://localhost:19002
      ACCURACY_ANTHROPIC_API_KEY: ${{ secrets.ACCURACY_ANTHROPIC_API_KEY }}
      ACCURACY_OPENAI_API_KEY: ${{ secrets.ACCURACY_OPENAI_API_KEY }}
      ACCURACY_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Boot AsterixDB sample cluster
        run: bash scripts/ci/boot_cluster.sh
        env:
          CC_BASE_URL: ${{ env.ACCURACY_CC_BASE_URL }}

      - name: Install gateway with accuracy extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,accuracy]'

      - name: Run accuracy suite
        env:
          ACCURACY_LOAD_DATA: "1"
        run: |
          pytest tests/accuracy -m accuracy -v

      - name: Render markdown brief
        if: always()
        run: |
          RESULT_FILE="$(find .accuracy/results -name "${ACCURACY_RUN_ID}.json" | head -1)"
          if [ -n "$RESULT_FILE" ]; then
            python -m tests.accuracy.sdk.report "$RESULT_FILE" --out .accuracy/brief.md
          else
            echo "No results file produced." | tee .accuracy/brief.md
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: .accuracy/

      - name: Comment brief on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: accuracy-tests
          recreate: true
          path: .accuracy/brief.md
